function todayStr(offsetDays){
  const d = new Date();
  if(offsetDays) d.setDate(d.getDate()+offsetDays);
  // WIB
  const wib = new Date(d.toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));
  return wib.toISOString().slice(0,10);
}
function nowTimeWIB(){

async function sha256(msg){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const DEMO_PW_HASH = {}; // username -> hash, lazily filled with 'admin123'

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

async function demoApi(action, p){
  await new Promise(r=>setTimeout(r, 120)); // feel like network
  function writeLog(actorName, act, table, rid, desc){
    DEMO.auditlog.push({id:uid('log'),user_id:'',user_name:actorName||'system',action:act,table_name:table,record_id:rid,description:desc,created_at:new Date().toISOString()});
  }
  switch(action){
    case 'login': {
      if(p.password !== 'admin123') throw new Error('Username atau password salah. (Mode demo: password = admin123)');
      const u = DEMO.users.find(x=>x.username===p.username && x.status==='aktif');
      if(!u) throw new Error('Username atau password salah.');
      writeLog(u.name,'login','Users',u.id,'Login ke sistem');
      return u;
    }
    case 'bootstrap': return { groups: DEMO.groups, levels: DEMO.levels, students: DEMO.students };
    case 'listGroups': return DEMO.groups;
    case 'createGroup': { const row = Object.assign({id:uid('grp'),created_at:new Date().toISOString()}, p); DEMO.groups.push(row); writeLog(p.actor,'create','Groups',row.id,'Menambah kelompok'); return row; }
    case 'updateGroup': { const i = DEMO.groups.findIndex(g=>g.id===p.id); if(i<0) throw new Error('Kelompok tidak ditemukan'); DEMO.groups[i]=Object.assign({},DEMO.groups[i],p); writeLog(p.actor,'update','Groups',p.id,'Mengubah kelompok'); return DEMO.groups[i]; }
    case 'deleteGroup': { DEMO.groups = DEMO.groups.filter(g=>g.id!==p.id); writeLog(p.actor,'delete','Groups',p.id,'Menghapus kelompok'); return {id:p.id,deleted:true}; }

    case 'listUsers': return DEMO.users;
    case 'createUser': { const row = Object.assign({id:uid('usr'),status:'aktif'}, p); delete row.password; DEMO.users.push(row); writeLog(p.actor,'create','Users',row.id,'Menambah admin kelompok'); return row; }
    case 'updateUser': { const i = DEMO.users.findIndex(u=>u.id===p.id); if(i<0) throw new Error('User tidak ditemukan'); DEMO.users[i]=Object.assign({},DEMO.users[i],p); writeLog(p.actor,'update','Users',p.id,'Mengubah admin'); return DEMO.users[i]; }
    case 'deleteUser': { DEMO.users = DEMO.users.filter(u=>u.id!==p.id); writeLog(p.actor,'delete','Users',p.id,'Menghapus admin'); return {id:p.id,deleted:true}; }

    case 'listLevels': return DEMO.levels;

    case 'listStudents': return DEMO.students;
    case 'createStudent': { const row = Object.assign({id:uid('std'),created_at:new Date().toISOString(),status:'aktif'}, p); DEMO.students.push(row); writeLog(p.actor,'create','Students',row.id,'Menambah generus: '+row.name); return row; }
    case 'updateStudent': { const i = DEMO.students.findIndex(s=>s.id===p.id); if(i<0) throw new Error('Generus tidak ditemukan'); DEMO.students[i]=Object.assign({},DEMO.students[i],p); writeLog(p.actor,'update','Students',p.id,'Mengubah data generus'); return DEMO.students[i]; }
    case 'deleteStudent': { DEMO.students = DEMO.students.filter(s=>s.id!==p.id); writeLog(p.actor,'delete','Students',p.id,'Menghapus generus'); return {id:p.id,deleted:true}; }

    case 'listAttendance': {
      let rows = DEMO.attendance;
      if(p.date) rows = rows.filter(r=>r.date===p.date);
      if(p.group_id) rows = rows.filter(r=>r.group_id===p.group_id);
      if(p.from) rows = rows.filter(r=>r.date>=p.from);
      if(p.to) rows = rows.filter(r=>r.date<=p.to);
      if(p.generus_id) rows = rows.filter(r=>r.generus_id===p.generus_id);
      return rows;
    }
    case 'saveAttendanceBulk': {
      const now = new Date().toISOString();
      p.records.forEach(function(rec){
        const i = DEMO.attendance.findIndex(a=>a.generus_id===rec.generus_id && a.date===rec.date);

        if(i>=0) DEMO.attendance[i]=row; else DEMO.attendance.push(row);
      });
      writeLog(p.actor,'update','Attendance','-','Menyimpan absensi ('+p.records.length+' generus)');
      return p.records;
    }
    case 'listAuditLog': return DEMO.auditlog.slice().reverse().slice(0,300);
    default: throw new Error('Aksi tidak dikenal (demo): '+action);
  }
}

/* ============================================================================
   API LAYER — routes to Google Apps Script if configured, else demo mode
============================================================================ */
async function api(action, payload){
  payload = payload || {};
  if(State.user){ payload.actor = State.user.name; payload.actor_id = State.user.id; }
  if(!State.apiUrl){
    return demoApi(action, payload);
  }
  const res = await fetch(State.apiUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify({ action, payload }),
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Terjadi kesalahan pada server.');
  return json.data;
}

/* ============================================================================
   TOAST
============================================================================ */
function toast(msg, kind){
  clearTimeout(State.toastTimer);
  let el = document.getElementById('toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.id='toast'; el.className='toast';
  const icon = kind==='error' ? '⚠️' : '✓';
  el.innerHTML = '<span>'+icon+'</span><span>'+escapeHtml(msg)+'</span>';
  document.body.appendChild(el);
  State.toastTimer = setTimeout(()=>el.remove(), 3200);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================
   SIGNATURE ELEMENT — "cincin tasbih" attendance ring (beads = ticks)
============================================================================ */
function ringSVG(percent, size, color, label){
  size = size||96; color = color||'var(--pine-600)';
  const r = size/2 - 10, c = size/2;
  const circ = 2*Math.PI*r;
  const dash = circ*(percent/100);
  const beads = 24, beadR = 2.1;
  let ticks = '';
  for(let i=0;i<beads;i++){
    const a = (i/beads)*2*Math.PI - Math.PI/2;
    const bx = c + (r+9)*Math.cos(a), by = c + (r+9)*Math.sin(a);
    const on = i/beads*100 <= percent;
    ticks += '<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="'+beadR+'" fill="'+(on?color:'#E7E4D8')+'"/>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle class="ring-track" cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke-width="7"/>'
    + '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ+'" transform="rotate(-90 '+c+' '+c+')"/>'
    + ticks
    + '<text x="'+c+'" y="'+(c-2)+'" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="'+(size*0.20)+'" fill="var(--ink)">'+Math.round(percent)+'%</text>'
    + (label? '<text x="'+c+'" y="'+(c+16)+'" text-anchor="middle" font-family="Inter" font-size="9.5" fill="var(--ink-faint)">'+label+'</text>' : '')
    + '</svg>';
}

============================================================================ */
const STATUS_LIST = ['Hadir','Izin','Sakit','Alpa','Terlambat'];
function statusBadge(status){
  if(!status) return '<span class="chip badge-belum">Belum diabsen</span>';
  const cls = {Hadir:'badge-hadir',Izin:'badge-izin',Sakit:'badge-sakit',Alpa:'badge-alpa',Terlambat:'badge-terlambat'}[status]||'badge-belum';
  return '<span class="chip '+cls+'">'+status+'</span>';
}
function computeDayStats(students, attendance, date, groupId){
  const inScope = students.filter(s=> (!groupId || s.group_id===groupId) && s.status==='aktif');
  const todays = attendance.filter(a=>a.date===date && (!groupId || a.group_id===groupId));
  const byId = {}; todays.forEach(a=>byId[a.generus_id]=a);
  const stat = {total:inScope.length, Hadir:0, Izin:0, Sakit:0, Alpa:0, Terlambat:0, belum:0};
  inScope.forEach(s=>{ const a=byId[s.id]; if(a) stat[a.status]=(stat[a.status]||0)+1; else stat.belum++; });
  return stat;
}
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}
function fmtShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function statCard(label, value, sub, icon){
  return `<div class="stat-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">

    <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">${sub}</div>
  </div>`;
}

function renderDashboardGroup(body){
  const g = State.cache.groups.find(x=>x.id===myGroupId()) || {};
  const students = myStudents().filter(s=>s.status==='aktif');
  const att = State.cache.attendance.filter(a=>a.group_id===myGroupId());
  const date = todayStr();
  const stat = computeDayStats(students, att, date, myGroupId());
  const pct = stat.total? Math.round((stat.Hadir/stat.total)*100):0;

  const categories = ['CABERAWIT','PRA REMAJA','REMAJA','PRA NIKAH'];
  const perCat = categories.map(cat=>{
    const catStudents = students.filter(s=>s.level===cat);
    const s = computeDayStats(catStudents, att, date, myGroupId());
    return {cat, ...s};
  });

  const last7 = [...Array(7)].map((_,i)=>todayStr(-6+i));
  const last7pct = last7.map(d=>{ const s = computeDayStats(students, att, d, myGroupId()); return s.total? Math.round((s.Hadir/s.total)*100):0; });

  body.innerHTML = `
  <div style="background:linear-gradient(120deg,var(--pine-800),var(--pine-700));border-radius:18px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
    <div>
      <h3 style="color:#fff;margin:0 0 4px;font-size:18px;">${escapeHtml(g.group_name||'Kelompok')}</h3>
      <p style="color:#B9D3C4;margin:0;font-size:13px;">${fmtDate(date)}</p>
    </div>
    <button class="btn btn-amber" onclick="goTo('absensi')">${ICON.check} Absen sekarang</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;">
    ${statCard('Total Generus', stat.total, 'aktif di kelompok', ICON.users)}
    ${statCard('Hadir', stat.Hadir, '', ICON.check)}
    ${statCard('Izin/Sakit', stat.Izin+stat.Sakit, '', ICON.clock)}
    ${statCard('Alpa', stat.Alpa, '', ICON.x)}
    ${statCard('Belum diabsen', stat.belum, '', ICON.bell)}
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;" class="respGrid">
    <div class="card" style="padding:18px;">
      <h4 style="margin:0 0 4px;font-size:14.5px;">Rekap Jenjang — Hari Ini</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px;">
        ${perCat.map(c=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;">
          <div style="font-size:12px;font-weight:700;color:var(--pine-700);margin-bottom:6px;">${c.cat}</div>
          <div style="font-size:11.5px;color:var(--ink-soft);line-height:1.7;">
            Total: <b>${c.total}</b><br>Hadir: <b style="color:var(--hadir)">${c.Hadir}</b> · Izin: <b style="color:var(--izin)">${c.Izin}</b><br>Sakit: <b style="color:#A97C1E">${c.Sakit}</b> · Alpa: <b style="color:var(--alpa)">${c.Alpa}</b>
          </div>
        </div>`).join('')}
      </div>
      <h4 style="margin:20px 0 4px;font-size:14.5px;">Tren 7 Hari Terakhir</h4>
      <canvas id="chart7dGroup" height="150"></canvas>
    </div>
    <div class="card" style="padding:18px;text-align:center;">
      <h4 style="margin:0 0 14px;font-size:14.5px;text-align:left;">Kehadiran Hari Ini</h4>
      ${ringSVG(pct,150,'var(--pine-600)')}
      <p style="font-size:12px;color:var(--ink-faint);margin:12px 0 0;">${stat.Hadir} dari ${stat.total} generus hadir</p>
    </div>
  </div>
  <style>@media(max-width:900px){.respGrid{grid-template-columns:1fr !important;}}</style>
  `;
  new Chart(document.getElementById('chart7dGroup'), {
    type:'bar',

    options:{ plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#EFEDE3'}}, x:{grid:{display:false}} } },
  });
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

}
async function saveGroup(id){
  const data = {
    group_code: val('f_code'), group_name: val('f_name'), dusun: val('f_dusun'), region: val('f_region'),
    address: val('f_addr'), admin_name: val('f_admin'), admin_wa: val('f_wa'), status: val('f_status'),
  };
  if(!data.group_name){ toast('Nama kelompok wajib diisi.','error'); return; }
  try{
    if(id){ data.id = id; await api('updateGroup', data); } else { await api('createGroup', data); }
    closeModal(); toast('Data kelompok tersimpan.');
    await refreshCache(); renderPage();
  }catch(e){ toast(e.message,'error'); }
}
async function removeGroup(id){
  if(!confirm('Hapus kelompok ini? Data generus di dalamnya tidak ikut terhapus.')) return;
  try{ await api('deleteGroup',{id}); toast('Kelompok dihapus.'); await refreshCache(); renderPage(); }
  catch(e){ toast(e.message,'error'); }
}
function openGroupDetail(id){
  const g = State.cache.groups.find(x=>x.id===id); if(!g) return;
  const students = State.cache.students.filter(s=>s.group_id===id && s.status==='aktif');
  const date = todayStr();
  const stat = computeDayStats(students, State.cache.attendance, date, id);
  const pct = stat.total? Math.round(stat.Hadir/stat.total*100):0;
  modalShell(g.group_name, `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;">
      ${ringSVG(pct,84,'var(--pine-600)')}
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.8;">
        <div><b>${stat.total}</b> generus aktif</div>
        <div>Admin: <b>${escapeHtml(g.admin_name||'-')}</b></div>
        <div>Dusun ${escapeHtml(g.dusun||'-')} • ${escapeHtml(g.region||'')}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">

      ${statusBadge('Sakit').replace('Sakit','Sakit '+stat.Sakit)}
      ${statusBadge('Alpa').replace('Alpa','Alpa '+stat.Alpa)}
      ${statusBadge('Terlambat').replace('Terlambat','Terlambat '+stat.Terlambat)}

}

async function saveUser(id){

  try{
    if(id){ data.id=id; await api('updateUser', data); } else { await api('createUser', data); }

  }catch(e){ toast(e.message,'error'); }

      <td style="cursor:pointer;" onclick="openStudentDetail('${s.id}')"><div style="display:flex;align-items:center;gap:9px;"><div style="width:28px;height:28px;border-radius:99px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--pine-700);">${initials(s.name)}</div><b>${escapeHtml(s.name)}</b></div></td>

      <td style="text-align:right;white-space:nowrap;"><button class="btn btn-ghost btn-sm" onclick="openStudentForm('${s.id}')">${ICON.edit}</button><button class="btn btn-danger btn-sm" onclick="removeStudent('${s.id}')">${ICON.trash}</button></td>

async function saveStudent(id){
  const data = {
    name: val('f_sname'), nickname: val('f_snick'), gender: val('f_sgender'), birth_date: val('f_sbirth'),
    group_id: val('f_sgroup'), level: val('f_slevel'), class: val('f_sclass'), parent_wa: val('f_swa'),
    parent_name: val('f_sparent'), address: val('f_saddr'), notes: val('f_snotes'),
  };
  if(!data.name){ toast('Nama generus wajib diisi.','error'); return; }
  try{
    if(id){ data.id=id; await api('updateStudent', data); } else {
      data.member_code = 'GEN-'+Math.floor(1000+Math.random()*9000);
      data.join_date = todayStr(); data.status='aktif';
      await api('createStudent', data);
    }
    closeModal(); toast('Data generus tersimpan.'); await refreshCache(); renderPage();
  }catch(e){ toast(e.message,'error'); }
}

function markAllPresent(){
  const ui = State.ui;
  let students = State.cache.students.filter(s=>s.group_id===ui.absenGroup && s.status==='aktif');

async function submitAttendance(){
  const ui = State.ui;
  const drafts = ui.drafts;
  const ids = Object.keys(drafts);
  if(!ids.length){ toast('Belum ada perubahan absensi untuk disimpan.','error'); return; }
  const records = ids.map(id=>{
    const s = State.cache.students.find(x=>x.id===id);
    return { generus_id:id, group_id:s.group_id, date:ui.absenDate, status:drafts[id], method:'manual', time: nowTimeWIB() };
  });
  try{
    await api('saveAttendanceBulk', {records});
    State.ui.drafts = {};
    toast('Absensi berhasil disimpan.');
    await refreshCache(); renderPage();
  }catch(e){ toast(e.message,'error'); }
}

  </div>`;
}
function exportRekapCSV(){
  const ui = State.ui.rekap;
  let rows = State.cache.attendance.filter(a=> a.date>=ui.from && a.date<=ui.to && (isMaster()? true : a.group_id===myGroupId()));
  if(ui.groupId) rows = rows.filter(a=>a.group_id===ui.groupId);
  if(ui.status) rows = rows.filter(a=>a.status===ui.status);
  const byId = Object.fromEntries(State.cache.students.map(s=>[s.id,s]));
  const groupName = id => (State.cache.groups.find(g=>g.id===id)||{}).group_name || '-';
  const header = ['Tanggal','Nama','Kode Generus','Kelompok','Jenjang','Kelas','Status','Jam','Metode'];
  const lines = [header.join(',')].concat(rows.map(a=>{ const s=byId[a.generus_id]||{}; return [a.date,csvSafe(s.name),s.member_code,csvSafe(groupName(a.group_id)),s.level,csvSafe(s.class),a.status,a.time,a.method].join(','); }));
  downloadFile('rekap-kehadiran_'+ui.from+'_'+ui.to+'.csv', lines.join('\n'), 'text/csv');
  toast('File CSV rekap kehadiran diunduh.');
}
function csvSafe(s){ s=String(s==null?'':s); return /[,"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================================
   LAPORAN (Admin Master)
============================================================================ */
function renderLaporan(body){
  const groups = State.cache.groups;
  body.innerHTML = `
  <div class="card" style="padding:20px;margin-bottom:16px;">
    <h4 style="margin:0 0 4px;font-size:15px;">Cetak Laporan Rekap</h4>
    <p style="margin:0 0 16px;font-size:12.5px;color:var(--ink-faint);">Laporan memakai kop <b>KBM GENERUS MAGELANG BARAT</b> lengkap dengan periode, kelompok, dan nama admin.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
      <div><label class="field">Kelompok</label><select class="input" id="lapGroup"><option value="">Semua Kelompok</option>${groups.map(g=>`<option value="${g.id}">${escapeHtml(g.group_name)}</option>`).join('')}</select></div>
      <div><label class="field">Dari</label><input class="input" type="date" id="lapFrom" value="${todayStr(-30)}"></div>
      <div><label class="field">Sampai</label><input class="input" type="date" id="lapTo" value="${todayStr()}"></div>
      <button class="btn btn-primary" onclick="generateLaporan()">${ICON.doc} Buat Laporan</button>
    </div>
  </div>
  <div id="lapPreview"></div>`;
}
function generateLaporan(){
  const groupId = val('lapGroup'), from = val('lapFrom'), to = val('lapTo');
  const g = groupId? State.cache.groups.find(x=>x.id===groupId) : null;
  let rows = State.cache.attendance.filter(a=>a.date>=from && a.date<=to && (!groupId || a.group_id===groupId));
  const byId = Object.fromEntries(State.cache.students.map(s=>[s.id,s]));
  const groupName = id => (State.cache.groups.find(x=>x.id===id)||{}).group_name || '-';
  const summary = {Hadir:0,Izin:0,Sakit:0,Alpa:0,Terlambat:0}; rows.forEach(r=>summary[r.status]=(summary[r.status]||0)+1);
  document.getElementById('lapPreview').innerHTML = `
  <div class="card" style="padding:24px;" id="printArea">
    <div style="text-align:center;border-bottom:2px solid var(--pine-700);padding-bottom:14px;margin-bottom:16px;">
      <h3 style="margin:0;font-size:17px;color:var(--pine-700);">KBM GENERUS MAGELANG BARAT</h3>
      <p style="margin:4px 0 0;font-size:12.5px;">Laporan Rekap Kehadiran</p>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;flex-wrap:wrap;gap:6px;">
      <span>Kelompok: <b>${escapeHtml(g? g.group_name : 'Semua Kelompok')}</b></span>
      <span>Periode: <b>${fmtShort(from)} – ${fmtShort(to)}</b></span>
      <span>Dicetak: <b>${fmtShort(todayStr())}</b> oleh <b>${escapeHtml(State.user.name)}</b></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;">
      ${STATUS_LIST.map(s=>`<div style="text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px;"><div style="font-size:17px;font-weight:700;font-family:Lexend;color:${statusColor(s)}">${summary[s]||0}</div><div style="font-size:10.5px;color:var(--ink-faint);">${s}</div></div>`).join('')}
    </div>
    <table><thead><tr><th>Tanggal</th><th>Nama</th><th>Kelompok</th><th>Kelas</th><th>Status</th></tr></thead>
    <tbody>${rows.slice(0,150).sort((a,b)=>b.date.localeCompare(a.date)).map(a=>{const s=byId[a.generus_id]||{}; return `<tr><td>${fmtShort(a.date)}</td><td>${escapeHtml(s.name||'-')}</td><td>${escapeHtml(groupName(a.group_id))}</td><td>${escapeHtml(s.class||'-')}</td><td>${statusBadge(a.status)}</td></tr>`;}).join('')}</tbody></table>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-ghost" onclick="window.print()">${ICON.doc} Print / Simpan sebagai PDF</button>
    <button class="btn btn-ghost" onclick="exportLaporanCSV('${groupId}','${from}','${to}')">${ICON.download} Export CSV</button>
  </div>`;
}
function exportLaporanCSV(groupId, from, to){
  let rows = State.cache.attendance.filter(a=>a.date>=from && a.date<=to && (!groupId || a.group_id===groupId));
  const byId = Object.fromEntries(State.cache.students.map(s=>[s.id,s]));
  const groupName = id => (State.cache.groups.find(x=>x.id===id)||{}).group_name || '-';
  const header = ['Tanggal','Nama','Kelompok','Kelas','Status'];
  const lines = [header.join(',')].concat(rows.map(a=>{ const s=byId[a.generus_id]||{}; return [a.date,csvSafe(s.name),csvSafe(groupName(a.group_id)),csvSafe(s.class),a.status].join(','); }));
  downloadFile('laporan-kbm_'+from+'_'+to+'.csv', lines.join('\n'), 'text/csv');
  toast('Laporan CSV diunduh. Gunakan tombol Print untuk versi PDF.');
}

    <table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Tabel</th><th>Keterangan</th></tr></thead>

/* ============================================================================
   MODAL HELPERS
============================================================================ */
function modalShell(title, contentHtml, onSave, extraActions){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop'; backdrop.id='formModal';
  backdrop.innerHTML = `<div class="modal" style="padding:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:16.5px;">${title}</h3>
      <button onclick="closeModal()" class="btn btn-ghost btn-sm">${ICON.x}</button>
    </div>
    <div id="modalBody">${contentHtml}</div>
    <div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      ${(extraActions||[]).map((a,i)=>`<button class="btn btn-ghost" id="extraAction${i}">${a.label}</button>`).join('')}
      ${onSave? `<button class="btn btn-primary" id="modalSaveBtn">Simpan</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  if(onSave) document.getElementById('modalSaveBtn').onclick = onSave;
  (extraActions||[]).forEach((a,i)=> document.getElementById('extraAction'+i).onclick = a.fn );
  return backdrop;
}
function closeModal(){ const m = document.getElementById('formModal') || document.getElementById('genModal'); if(m) m.remove(); }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* ============================================================================
   START
============================================================================ */
boot();
